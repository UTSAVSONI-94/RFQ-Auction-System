<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; fill: #64748b; }
      .box-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #1e293b; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #64748b; }
      .edge-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #2563eb; }
      .edge-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #64748b; }
      .tier-bg { rx: 10; ry: 10; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .card { rx: 6; ry: 6; stroke-width: 1.2; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.04)); }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" fill="#f8fafc"/>

  <!-- Header -->
  <text x="40" y="42" class="title">RFQ British Auction System - Architecture</text>
  <text x="40" y="62" class="subtitle">High-level component interactions, concurrency controls, and data flow</text>

  <!-- ==================== TIER 1: FRONTEND ==================== -->
  <rect x="40" y="90" width="260" height="490" class="tier-bg" fill="#f0fdf4" stroke="#86efac"/>
  <text x="60" y="120" class="box-title" fill="#166534">Frontend Layer (React + Vite)</text>
  <text x="60" y="136" class="node-sub">Port 5173 | Single Page Application</text>

  <!-- Node: RfqList -->
  <rect x="60" y="160" width="220" height="60" class="card" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="75" y="185" class="node-text">RfqList Component (/)</text>
  <text x="75" y="203" class="node-sub">Table, lowest bid, status badges</text>

  <!-- Node: CreateRfq -->
  <rect x="60" y="240" width="220" height="60" class="card" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="75" y="265" class="node-text">CreateRfq Form (/create)</text>
  <text x="75" y="283" class="node-sub">Local to UTC ISO normalization</text>

  <!-- Node: RfqDetails -->
  <rect x="60" y="320" width="220" height="130" class="card" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="75" y="345" class="node-text">RfqDetails Page (/rfqs/:id)</text>
  <text x="75" y="365" class="node-sub">• L1-highlighted bids table</text>
  <text x="75" y="383" class="node-sub">• Active-gated bid submit form</text>
  <text x="75" y="401" class="node-sub">• Chronological activity log</text>
  <text x="75" y="419" class="node-sub">• 5-second polling loop</text>

  <!-- Node: Timer -->
  <rect x="60" y="470" width="220" height="55" class="card" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="75" y="493" class="node-text">1s Local Countdown Engine</text>
  <text x="75" y="510" class="node-sub">Offset = server_time - Date.now()</text>

  <!-- ==================== TIER 2: BACKEND ==================== -->
  <rect x="350" y="90" width="260" height="490" class="tier-bg" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="370" y="120" class="box-title" fill="#1e40af">Backend Layer (FastAPI)</text>
  <text x="370" y="136" class="node-sub">Port 8000 | Python 3.14 + SQLAlchemy</text>

  <!-- Node: Router -->
  <rect x="370" y="160" width="220" height="75" class="card" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="385" y="183" class="node-text">REST API Router (main.py)</text>
  <text x="385" y="201" class="node-sub">POST /rfqs  |  GET /rfqs</text>
  <text x="385" y="219" class="node-sub">GET /rfqs/:id  |  POST /rfqs/:id/bids</text>

  <!-- Node: Bid Service -->
  <rect x="370" y="255" width="220" height="95" class="card" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="385" y="278" class="node-text">Bid Engine (bid_service.py)</text>
  <text x="385" y="296" class="node-sub">• SELECT ... FOR UPDATE row lock</text>
  <text x="385" y="314" class="node-sub">• Trigger rule (ANY / RANK / L1)</text>
  <text x="385" y="332" class="node-sub">• Capping: min(close + Y, forced)</text>

  <!-- Node: Ranking Service -->
  <rect x="370" y="370" width="220" height="60" class="card" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="385" y="393" class="node-text">Ranking Engine (ranking.py)</text>
  <text x="385" y="411" class="node-sub">Latest bid per carrier, L1..Ln ties</text>

  <!-- Node: Status Resolver -->
  <rect x="370" y="450" width="220" height="50" class="card" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="385" y="473" class="node-text">Status Resolver (status.py)</text>
  <text x="385" y="490" class="node-sub">Upcoming / Active / Closed / Forced</text>

  <!-- Node: Clock -->
  <rect x="370" y="515" width="220" height="45" class="card" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="385" y="537" class="node-text">UTC Clock Helper (clock.py)</text>
  <text x="385" y="551" class="node-sub">get_now() and ensure_utc()</text>

  <!-- ==================== TIER 3: DATABASE ==================== -->
  <rect x="660" y="90" width="260" height="490" class="tier-bg" fill="#fdf4ff" stroke="#f0abfc"/>
  <text x="680" y="120" class="box-title" fill="#86198f">Storage Layer (PostgreSQL)</text>
  <text x="680" y="136" class="node-sub">Database: rfq_auction :5432</text>

  <!-- Table: rfqs -->
  <rect x="680" y="160" width="220" height="85" class="card" fill="#ffffff" stroke="#f5d0fe"/>
  <text x="695" y="183" class="node-text">Table: rfqs</text>
  <text x="695" y="201" class="node-sub">reference_id (unique), name</text>
  <text x="695" y="219" class="node-sub">start, close, forced, pickup</text>
  <text x="695" y="237" class="node-sub">trigger_window_x, extension_y</text>

  <!-- Table: suppliers -->
  <rect x="680" y="260" width="220" height="60" class="card" fill="#ffffff" stroke="#f5d0fe"/>
  <text x="695" y="285" class="node-text">Table: suppliers</text>
  <text x="695" y="303" class="node-sub">id, name (unique carrier string)</text>

  <!-- Table: bids -->
  <rect x="680" y="335" width="220" height="95" class="card" fill="#ffffff" stroke="#f5d0fe"/>
  <text x="695" y="358" class="node-text">Table: bids</text>
  <text x="695" y="376" class="node-sub">rfq_id, supplier_id, created_at</text>
  <text x="695" y="394" class="node-sub">freight, origin, dest charges</text>
  <text x="695" y="412" class="node-sub">total_price (NUMERIC 12,2)</text>

  <!-- Table: activity_logs -->
  <rect x="680" y="445" width="220" height="90" class="card" fill="#ffffff" stroke="#f5d0fe"/>
  <text x="695" y="468" class="node-text">Table: activity_logs</text>
  <text x="695" y="486" class="node-sub">event_type (BID / EXTEND / SKIP)</text>
  <text x="695" y="504" class="node-sub">description, created_at</text>
  <text x="695" y="522" class="node-sub">old_close_time, new_close_time</text>

  <!-- ==================== CONNECTIONS / FLOWS ==================== -->
  <!-- Frontend -> Backend -->
  <path d="M 280 190 L 370 190" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 280 270 L 370 205" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 280 340 L 370 220" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 280 400 L 370 280" stroke="#2563eb" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Backend -> Database -->
  <path d="M 590 200 L 680 190" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 590 280 L 680 200" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 590 300 L 680 280" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 590 320 L 680 360" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 590 340 L 680 480" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 590 400 L 680 390" stroke="#7c3aed" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- Flow labels -->
  <rect x="285" y="168" width="68" height="16" fill="#f8fafc" rx="3"/>
  <text x="288" y="180" class="edge-label">GET /rfqs</text>

  <rect x="285" y="370" width="82" height="16" fill="#f8fafc" rx="3"/>
  <text x="288" y="382" class="edge-label">POST bids</text>

  <rect x="595" y="225" width="80" height="16" fill="#f8fafc" rx="3"/>
  <text x="598" y="237" style="font-family: sans-serif; font-size: 10px; font-weight: bold; fill: #dc2626;">FOR UPDATE</text>

</svg>